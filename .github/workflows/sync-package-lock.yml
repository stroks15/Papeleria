name: Sync package lock

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: write

concurrency:
  group: sync-package-lock
  cancel-in-progress: false

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit and push lockfile safely
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json ya está sincronizado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sincronizar package-lock con package.json"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase falló; abortando rebase y reintentando."
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            }

            if git push origin HEAD:main; then
              echo "package-lock.json sincronizado correctamente."
              exit 0
            fi

            echo "Push concurrente; reintentando ($attempt/5)..."
            sleep $((attempt * 2))
          done

          echo "No fue posible publicar el lockfile después de 5 intentos."
          exit 1
